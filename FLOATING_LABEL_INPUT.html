<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>"sample code"</title>
    
    <!-- CSS CODE ------>
    
    <style>
      body{
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #0f172a
        font-family: sans-serif;
      }
      .input-box{
        position: relative;
        width: 250px;
      }
      input{
        width: 100%;
        padding: 12px;
        background-color: transparent;
        border: 2px solid #38bdf8;
        outline: none;
        color: white;
        font-size:16px;
        border-radius: 8px;
      }
      label{
        position: absolute;
        left: 12px;
        top: 12px;
        color: #94a3b8;
        pointer-events: none;
        transition: 0.3s;
        background-color:#0f172a;
        padding:0 5px;
      }
      input:focus+label, input:valid+label{
        top: -8px;
        font-size: 12px;
        color: #38bdf8;
      }
    </style>
    
    <!-- HTML CODE ------>
    
    </head>
    <body style="background-color: #0f172a;">
      <div class="input-box">
        <input type="text" required>
        <label>User name</label>
      </div>
    </body>
</html>
